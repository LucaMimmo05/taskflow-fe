<div class="profile-page">
    <div class="profile-header">
        <h1>Profilo</h1>
        <p>Gestisci le tue informazioni personali</p>
    </div>

    <div class="profile-content">
        <!-- Avatar Section -->
        <div class="profile-card">
            <h2>Immagine Profilo</h2>
            <div class="avatar-section">
                <div class="avatar-preview">
                    @if (previewUrl || avatarUrl) {
                        <img [src]="previewUrl || avatarUrl" alt="Avatar" class="avatar-image" />
                    } @else {
                        <div class="avatar-placeholder avatar-gradient-1">{{ getInitials() }}</div>
                    }
                    @if (isUploading) {
                        <div class="upload-overlay">
                            <div class="spinner"></div>
                        </div>
                    }
                </div>
                <div class="avatar-actions">
                    <label for="avatar-upload" class="upload-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Scegli immagine
                    </label>
                    <input type="file" id="avatar-upload" accept="image/*" (change)="onFileSelected($event)" style="display: none;" />
                    @if (selectedFile) {
                        <button class="save-avatar-btn" (click)="uploadAvatar()" [disabled]="isUploading">
                            {{ isUploading ? 'Caricamento...' : 'Salva' }}
                        </button>
                    }
                </div>
            </div>
        </div>

        <!-- Profile Info Section -->
        <div class="profile-card">
            <h2>Informazioni Personali</h2>
            
            @if (error) {
                <div class="error-message">{{ error }}</div>
            }

            <div class="form-group">
                <label for="displayName">Nome Completo *</label>
                <input type="text" id="displayName" [(ngModel)]="displayName" placeholder="Il tuo nome" [disabled]="isSaving" />
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" [(ngModel)]="email" placeholder="la-tua-email@example.com" [disabled]="isSaving" />
            </div>
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" [(ngModel)]="password" placeholder="Nuova password (min 8 caratteri)" [disabled]="isSaving" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Conferma Password *</label>
                <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Ripeti la password" [disabled]="isSaving" />
            </div>
            <button class="save-btn" (click)="saveProfile()" [disabled]="isSaving">
                @if (isSaving) {
                    <span class="spinner-small"></span>
                    Salvataggio...
                } @else {
                    Salva Modifiche
                }
            </button>
        </div>
    </div>
</div>
